services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/php-fpm.docker
    restart: unless-stopped
    volumes:
      - ./app:/var/www
      - ./docker/php.ini:/usr/local/etc/php/php.ini:ro
    depends_on:
      redis:
        condition: service_healthy

  php-cli:
    build:
      context: .
      dockerfile: ./docker/php-cli.docker
    restart: "no"
    working_dir: /var/www
    volumes:
      - ./app:/var/www
      - ./docker/php.ini:/usr/local/etc/php/php.ini:ro
    depends_on:
      redis:
        condition: service_healthy

  market-data:
    build:
      context: .
      dockerfile: ./docker/php-cli.docker
    restart: unless-stopped
    command: php artisan app:watch-market-data
    volumes:
      - ./app:/var/www
      - ./docker/php.ini:/usr/local/etc/php/php.ini:ro
    depends_on:
      redis:
        condition: service_healthy

  spread-calculator:
    build:
      context: .
      dockerfile: ./docker/php-cli.docker
    restart: unless-stopped
    command: ["sh", "-lc", "php artisan market:calculate-spreads $${LUMA_EXECUTE_FLAG:-}"]
    environment:
      LUMA_EXECUTE_FLAG: ${LUMA_EXECUTE_FLAG:-}
    volumes:
      - ./app:/var/www
      - ./docker/php.ini:/usr/local/etc/php/php.ini:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis_data:
